<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март - Магическа Картичка</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-pink: #d42d4d;
            --dusty-rose: #a97171;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            background: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Спира скролването и местенето */
            position: fixed; /* Заковава целия екран */
            width: 100%;
        }

        /* НАЧАЛЕН ЕКРАН */
        #setup {
            text-align: center;
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('1.png');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            position: fixed;
            z-index: 2000;
            border: 2px solid var(--dusty-rose);
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #setup h1 {
            font-family: 'Great Vibes', cursive;
            color: #000;
            font-size: 2.2rem;
            margin: 0;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 15px;
        }

        input {
            padding: 15px;
            border: 2px solid var(--dusty-rose);
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        /* КАРТИЧКА - ЦЕНТРИРАНЕ */
      .scene {
    width: 90vw;
    max-width: 380px;
    height: 80vh;
    perspective: 2000px;
    display: none; 
    justify-content: center;
    align-items: center;
    /* Вдигаме картичката нагоре, за да не е забита в долната част */
    margin-top: -5vh; 
}

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: url('2.png') center/cover;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .face.front { justify-content: center; }
        .face.back { transform: rotateY(180deg); justify-content: flex-start; }

        .face.front h2 { font-family: 'Great Vibes', cursive; font-size: 2.8rem; margin: 0; color: #000; }
        #display-name { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--rose-pink); margin: 0; text-align: center; }

        /* ТЕКСТ - По-голям и по-нагоре */
        #typing-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.7rem;
            color: #1a252f;
            text-align: center;
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            box-sizing: border-box;
            min-height: 160px;
            line-height: 1.3;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* БУКЕТ - Корекция на позицията */
#flower {
    position: absolute;
    left: 50%;
    bottom: 0px; /* Поставяме го на самото дъно на картичката */
    /* Тук е тайната: правим го висок 50% от височината на екрана */
    height: 70vh; 
    width: auto; /* Ширината се наглася сама, за да не се разтегли картинката */
    opacity: 0;
    mix-blend-mode: normal;
    transform: translateX(-50%) scale(0.1);
    transition: all 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    z-index: 100;
}

#flower.pop-out {
    opacity: 1;
    /* Увеличаваме мащаба спрямо новата височина */
    transform: translateX(-50%) scale(1.4); 
}
        /* БУТОНИ - Пепел от рози */
        button, .share-btn {
            background: linear-gradient(45deg, #a97171, #c99393) !important;
            color: white !important;
            border: none !important;
            padding: 15px 25px;
            border-radius: 35px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(169, 113, 113, 0.4);
            font-family: 'Montserrat', sans-serif;
        }

        #share-area {
            position: absolute;
            bottom: 25px;
            display: none;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .share-btn {
            font-size: 0.8rem;
            padding: 12px 20px;
        }

        .petal { 
            position: absolute; 
            background: #ffb7c5;
            border-radius: 150% 0 150% 0; 
            opacity: 0.8; 
            z-index: 999; 
            animation: fall linear forwards;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

     /* Специално за много големи екрани (лаптопи) */
@media (min-width: 1024px) {
    #flower.pop-out {
        transform: translateX(-50%) scale(1.1); /* На лаптоп 1.1 е напълно достатъчно */
    }
}

/* Корекция за телефони - там може да е още по-внушителен */
@media (max-width: 480px) {
    #flower {
        height: 45vh; /* На телефон 45% от екрана е идеално */
    }
    #flower.pop-out {
        transform: translateX(-50%) scale(1.2);
    }
}
    </style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mp3"></audio>

<div id="setup">
    <h1>Магия за 8-ми Март</h1>
    <p style="font-size: 0.9rem; color: #444;">Напиши името на дамата:</p>
    <input type="text" id="userName" placeholder="Име">
    <button onclick="startApp()">СЪЗДАЙ ✨</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        <div class="face front">
            <h2>Честит празник,</h2>
            <h1 id="display-name"></h1>
            <p style="position:absolute; bottom:30px; font-size:0.8rem; color:#444;">Докосни <span style="color:var(--rose-pink); font-weight:bold;">ТУК</span> за теб</p>
        </div>
        <div class="face back">
            <div id="typing-text"></div>
            <img src="bouquet.png" id="flower">
            <div id="share-area">
                <button class="share-btn" onclick="shareToOther(event)">ИЗПРАТИ НА ДРУГА ДАМА 🎀</button>
            </div>
        </div>
    </div>
</div>

<script>
    const wish = "Бъди винаги така сияйна, нежна като пролетен цвят и вдъхновяваща! Нека този празник ти донесе безброй усмивки и топлина в сърцето. Честит 8-ми Март!";
    let i = 0;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        if (name) {
            document.getElementById('userName').value = name;
            startApp(true);
        }
    }

    function startApp(auto = false) {
        const nameInput = document.getElementById('userName');
        const name = nameInput.value.trim();
        if (!name) return alert("Моля, въведи име.");

        document.getElementById('display-name').innerText = name + "!";
        document.getElementById('setup').style.display = 'none';
        document.getElementById('cardScene').style.display = 'flex';

        if (!auto) playMusic();
    }

    function playMusic() {
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        music.play().catch(() => console.log("Браузърът чака действие"));
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        playMusic(); // Пускаме музиката точно при отваряне
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        setInterval(createPetal, 500);
    }

  function typeWriter() {
    const textElement = document.getElementById("typing-text");
    if (i < wish.length) {
        textElement.innerHTML += wish.charAt(i);
        i++;
        setTimeout(typeWriter, 65);
    } else {
        // Текстът е готов! Сега чакаме 3 секунди (3000ms), 
        // за да може човекът да го прочете на спокойствие.
        setTimeout(() => {
            const img = document.getElementById('flower');
            img.classList.add('pop-out');
            
            // Бутонът за споделяне се появява последен
            setTimeout(() => {
                document.getElementById('share-area').style.display = 'block';
            }, 2500);
        }, 3000); // Промени тези 3000 на повече, ако искаш още по-дълга пауза
    }
}

    function shareToOther(event) {
        event.stopPropagation();
        const newName = prompt("Име на дамата:");
        if (newName) {
            const currentUrl = window.location.href.split('?')[0];
            const newUrl = currentUrl + "?name=" + encodeURIComponent(newName);
            navigator.clipboard.writeText(newUrl).then(() => {
                alert("Линкът за " + newName + " е копиран! ✨");
            });
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 15 + 10 + 'px';
        petal.style.width = size;
        petal.style.height = size;
        petal.style.animationDuration = (Math.random() * 2 + 4) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }
</script>
</body>
</html>
