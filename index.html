<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март - Магическа Картичка</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dusty-rose: #a97171;
            --rose-pink: #d4a5a5;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #fdf5f5;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
            touch-action: none;
        }

        /* ЦЕНТРИРАНА СЦЕНА */
        .scene {
            width: 90vw; max-width: 380px; height: 70vh;
            perspective: 2000px; display: flex;
            justify-content: center; align-items: center;
            position: relative; z-index: 10;
            transition: opacity 0.5s ease;
        }

        .card {
            width: 100%; height: 100%;
            position: relative; transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 20px;
            background: url('2.png') center/cover no-repeat;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
            display: flex; flex-direction: column;
            align-items: center; padding: 30px; box-sizing: border-box;
        }

        /* ПЪРВА СТРАНИЦА */
        .face.front { justify-content: center; text-align: center; }
        .face.front h2 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; margin: 0; color: #333; }
        #display-name { font-family: 'Marck Script', cursive; font-size: 3.2rem; color: var(--dusty-rose); margin: 10px 0; }
        .tap-hint { font-size: 0.9rem; color: #666; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* ВТОРА СТРАНИЦА */
        .face.back { transform: rotateY(180deg); justify-content: flex-start; position: relative; }
        #typing-text {
            font-family: 'Great Vibes', cursive; font-size: 1.7rem;
            color: #1a252f; text-align: center; margin-top: 40px;
            line-height: 1.4; width: 100%;
        }

        /* БУТОН СПОДЕЛЯНЕ */
        #share-area {
            display: none; position: absolute; bottom: 30px;
            left: 0; right: 0; text-align: center;
        }
        .share-btn {
            background: white; color: var(--dusty-rose); border: 2px solid var(--dusty-rose);
            padding: 12px 25px; border-radius: 30px; font-weight: 700; cursor: pointer;
        }

        /* БУКЕТ - ЦЕНТРИРАН ПРЕД КАРТИЧКАТА */
        #flower {
            position: fixed; left: 50%; bottom: -300px; height: 55vh;
            transform: translateX(-50%) scale(0.5); transition: all 2s ease-out;
            z-index: 100; opacity: 0; pointer-events: none;
        }
        #flower.pop-out { opacity: 1; bottom: 5vh; transform: translateX(-50%) scale(1.2); }

        /* СТРАНИЦА 3: ФОРМА ЗА СПОДЕЛЯНЕ */
        #setup {
            background: white; padding: 30px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: absolute; z-index: 2000; width: 85%; max-width: 350px;
            text-align: center; border: 2px solid var(--dusty-rose);
            display: none; /* Първоначално скрита */
        }
        #setup h1 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; margin-bottom: 15px; }
        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 2px solid var(--rose-pink); border-radius: 25px;
            font-size: 16px; text-align: center; outline: none; box-sizing: border-box;
        }
        #copyBtn {
            background: var(--dusty-rose); color: white; border: none;
            padding: 15px; border-radius: 25px; font-weight: bold;
            width: 100%; cursor: pointer; margin-top: 10px;
        }

        /* ЕФЕКТИ */
        .petal { position: fixed; z-index: 50; background: #ffc0cb; border-radius: 150% 0 150% 0; animation: fall linear forwards; pointer-events: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mp3"></audio>

<div id="setup">
    <h1>Изпрати магия ✨</h1>
    <input type="text" id="userName" placeholder="Име на друга дама">
    <select id="wishSelect">
        <option value="0">🌹 Класическо</option>
        <option value="1">❤️ За любима</option>
        <option value="2">👩‍👧 За мама</option>
        <option value="3">💼 За колежка</option>
    </select>
    <button id="copyBtn" onclick="copyMagicLink()">КОПИРАЙ ЛИНК</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        <div class="face front">
            <h2>Честит празник,</h2>
            <h1 id="display-name">За теб!</h1>
            <p class="tap-hint">Докосни, за да отвориш 🌸</p>
        </div>
        <div class="face back">
            <div id="typing-text"></div>
            <div id="share-area">
                <button class="share-btn" onclick="goToStep3(event)">ИЗПРАТИ НА ДРУГА ДАМА 🎀</button>
            </div>
        </div>
    </div>
</div>

<img src="bouquet.png" id="flower">

<script>
    const wishes = [
    // 1. Класическо
    "Честит 8-ми март! Бъди все така сияйна, нежна като пролетен цвят и вдъхновяваща! Нека усмивката не слиза от лицето ти!",
    
    // 2. За любима жена
    "Честит 8-ми март! Бъди все така най-нежна на света, защото си най-обичаната жена! Бъди весела, засмяна и с моята любов обляна!",
    
    // 3. За мама
    "Честит 8-ми март, мила мамо! Благодаря ти за добротата и безкрайната обич. Бъди здрава, все така сияйна и много щастлива!",
    
    // 4. За колежка
    "Честит 8-ми март! Желая ти здраве, професионални успехи и лично щастие, което да те кара да сияеш всеки ден!"
];

    let i = 0; 
    let selectedWish = "";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const wishIndex = urlParams.get('w') || 0;

        if (name) {
            document.getElementById('display-name').innerText = name + "!";
            selectedWish = wishes[wishIndex];
        } else {
            selectedWish = wishes[0];
        }
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        document.getElementById('bgMusic').play().catch(() => {});
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        setInterval(createPetal, 500);
    }

    function typeWriter() {
        if (i < selectedWish.length) {
            document.getElementById("typing-text").innerHTML += selectedWish.charAt(i);
            i++; setTimeout(typeWriter, 60);
        } else {
            setTimeout(() => {
                document.getElementById('flower').classList.add('pop-out');
                setTimeout(() => { document.getElementById('share-area').style.display = 'block'; }, 2000);
            }, 1000);
        }
    }

    // ПРЕХОД КЪМ СТРАНИЦА 3
    function goToStep3(event) {
        event.stopPropagation();
        // Скриваме картичката и букета плавно
        document.getElementById('cardScene').style.opacity = '0';
        document.getElementById('flower').style.opacity = '0';
        
        setTimeout(() => {
            document.getElementById('cardScene').style.display = 'none';
            document.getElementById('flower').style.display = 'none';
            document.getElementById('setup').style.display = 'block';
        }, 500);
    }

    function copyMagicLink() {
        const name = document.getElementById('userName').value.trim();
        const wishIdx = document.getElementById('wishSelect').value;
        if (!name) return alert("Моля, въведи име.");

        const baseUrl = window.location.origin + window.location.pathname;
        const newUrl = `${baseUrl}?name=${encodeURIComponent(name)}&w=${wishIdx}`;
        
        navigator.clipboard.writeText(newUrl).then(() => {
            alert(`Готово! Линкът за ${name} е копиран. Изпрати го! ✨`);
        });
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.width = petal.style.height = (Math.random() * 15 + 10) + 'px';
        petal.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 5000);
    }
</script>
</body>
</html>
