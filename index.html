<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март - Магическа Картичка</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-pink: #d4a5a5;
            --dusty-rose: #a97171;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fdf5f5;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* НАЧАЛЕН ЕКРАН */
        #setup {
            background: white;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            position: fixed;
            z-index: 2000;
            border: 2px solid var(--dusty-rose);
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        #setup h1 {
            font-family: 'Great Vibes', cursive;
            color: #000;
            font-size: 2.2rem;
            margin: 0;
        }

        input, #wishSelect {
            padding: 15px;
            border: 2px solid var(--dusty-rose);
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }

        #wishSelect { margin-top: 5px; cursor: pointer; background: white; }

        /* СЦЕНА И КАРТИЧКА */
        .scene {
            width: 90vw;
            max-width: 380px;
            height: 75vh;
            perspective: 2000px;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: url('2.png') center/cover;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .face.front { justify-content: center; align-items: center; }

        /* ВЪТРЕШНАТА СТРАНА (BACK) */
        .face.back {
            transform: rotateY(180deg);
            background-color: #fff9fa;
            background-image: none; /* Махаме фоновото изображение отвътре за по-добра четивност */
            justify-content: flex-start;
            align-items: center;
            position: relative; /* ВАЖНО ЗА БУТОНА */
        }

        .face.front h2 { font-family: 'Great Vibes', cursive; font-size: 2.8rem; margin: 0; color: #000; }
        #display-name { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--rose-pink); margin: 0; text-align: center; }

        .tap-hint {
            position: absolute;
            bottom: 45px;
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 30px;
            animation: pulse-tap 2s infinite ease-in-out;
        }

        @keyframes pulse-tap {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #typing-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: #1a252f;
            text-align: center;
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            min-height: 150px;
            line-height: 1.4;
            margin-top: 20px;
        }

        /* БУКЕТ */
        #flower {
            position: fixed;
            left: 50%;
            bottom: -150px;
            height: 60vh;
            width: auto;
            opacity: 0;
            transform: translateX(-50%) scale(0.5);
            transition: all 2.0s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 9999; /* НАЙ-ОТГОРЕ */
        }

        #flower.pop-out {
            opacity: 1;
            bottom: 5vh;
            transform: translateX(-50%) scale(1.3);
        }

        /* БУТОН ЗА СПОДЕЛЯНЕ - ЗАКОТВЕН ДОЛУ */
        #share-area {
            display: none;
            position: absolute;
            bottom: 30px; /* Фиксиран на 30px от дъното на КАРТИЧКАТА */
            left: 0;
            right: 0;
            text-align: center;
            padding-bottom: 20px; /* Въздух за мобилни ленти */
        }

        .share-btn {
            background: white !important;
            color: var(--dusty-rose) !important;
            border: 2px solid var(--dusty-rose) !important;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* ЛИСТЕНЦА */
        .petal {
            position: fixed;
            z-index: 9998; /* Точно под букета */
            pointer-events: none;
            background: #ffc0cb;
            border-radius: 150% 0 150% 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse-tap {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(0) scale(1.1); }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mp3"></audio>

<div id="setup">
    <h1>Магия за 8-ми Март</h1>
    <p style="font-size: 0.9rem; color: #444; margin: 0;">Напиши името на дамата:</p>
    <input type="text" id="userName" placeholder="Име">
    <select id="wishSelect">
        <option value="0">🌹 Класическо</option>
        <option value="1">❤️ За любима жена</option>
        <option value="2">👩‍👧 За мама</option>
        <option value="3">💼 За колежка</option>
    </select>
    <button onclick="startApp()" style="margin-top: 10px; background: var(--dusty-rose) !important; color: white !important; border: none !important;">СЪЗДАЙ ✨</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        <div class="face front">
            <h2>Честит празник,</h2>
            <h1 id="display-name"></h1>
            <p class="tap-hint">Докосни <span>ТУК</span> за теб</p>
        </div>
        <div class="face back">
            <div id="typing-text"></div>
            <div id="share-area">
                <button class="share-btn" onclick="shareToOther(event)">ИЗПРАТИ НА ДРУГА ДАМА 🎀</button>
            </div>
        </div>
    </div>
</div>

<img src="bouquet.png" id="flower">

<script>
    const wishes = [
        "Бъди винаги така сияйна, нежна като пролетен цвят и вдъхновяваща! Честит 8-ми Март!",
        "Ти си моето вдъхновение! Желая ти цялото щастие на света, защото го заслужаваш. Обичам те!",
        "Мила мамо, благодаря ти за добротата и любовта. Бъди здрава и все така усмихната!",
        "Уважаема колежке, пожелавам Ви здраве, успехи и много радостни моменти. Честит празник!"
    ];

    let wish = ""; 
    let i = 0;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const wishIndex = urlParams.get('w');

        if (name) {
            document.getElementById('userName').value = name;
            wish = wishes[wishIndex] || wishes[0];
            startApp(true);
        }
    }

    function startApp(auto = false) {
        const nameInput = document.getElementById('userName');
        const name = nameInput.value.trim();
        const select = document.getElementById('wishSelect');

        if (!name) return alert("Моля, въведи име.");

        if (!auto) {
            wish = wishes[select.value]; 
        }

        document.getElementById('display-name').innerText = name + "!";
        document.getElementById('setup').style.display = 'none';
        document.getElementById('cardScene').style.display = 'flex';
        if (!auto) playMusic();
    }

    function playMusic() {
        const music = document.getElementById('bgMusic');
        music.volume = 0.5;
        music.play().catch(() => console.log("Музиката чака действие"));
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        playMusic();
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        setInterval(createPetal, 500);
    }

    function typeWriter() {
        const textElement = document.getElementById("typing-text");
        if (i < wish.length) {
            textElement.innerHTML += wish.charAt(i);
            i++;
            setTimeout(typeWriter, 65);
        } else {
            setTimeout(() => {
                document.getElementById('flower').classList.add('pop-out');
                setTimeout(() => {
                    document.getElementById('share-area').style.display = 'block';
                }, 2000);
            }, 1000);
        }
    }

    function shareToOther(event) {
        event.stopPropagation();
        const newName = prompt("Име на дамата:");
        if (newName) {
            const select = document.getElementById('wishSelect');
            const wishIndex = select.value;
            const currentUrl = window.location.href.split('?')[0];
            const newUrl = currentUrl + "?name=" + encodeURIComponent(newName) + "&w=" + wishIndex;
            
            navigator.clipboard.writeText(newUrl).then(() => {
                alert("Линкът за " + newName + " е копиран! ✨");
            });
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 15 + 10 + 'px';
        petal.style.width = size;
        petal.style.height = size;
        petal.style.top = "-20px";
        petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }
</script>
</body>
</html>
