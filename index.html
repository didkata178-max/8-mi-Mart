<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: #fdf5f5;
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        /* НАЧАЛЕН ЕКРАН */
        #setup {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: fixed; z-index: 3000; width: 85%; max-width: 350px;
            text-align: center; border: 2px solid #a97171;
        }

        #setup h1 { font-family: 'Great Vibes', cursive; font-size: 2.5rem; margin-bottom: 20px; }

        /* СТИЛ ЗА МЕНЮТО - ТУК Е ВАЖНО */
        input, select {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 2px solid #d4a5a5; border-radius: 25px;
            font-size: 16px; text-align: center; display: block;
        }

        #startBtn {
            background: #a97171; color: white; border: none;
            padding: 15px 30px; border-radius: 25px; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 10px;
        }

        /* КАРТИЧКА */
        .scene { width: 90vw; max-width: 380px; height: 70vh; perspective: 2000px; display: none; position: relative; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.5s; }
        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 20px;
            background: url('2.png') center/cover no-repeat; /* ОРИГИНАЛЕН ФОН */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .face.back {
            transform: rotateY(180deg);
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            position: relative;
            /* ТУК НЯМА СВЕТЪЛ СЛОЙ - ЩЕ Е КАТО СНИМКАТА */
        }

        #display-name { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #a97171; margin-top: 40%; text-align: center; }
        
        #typing-text {
            font-family: 'Great Vibes', cursive; font-size: 1.6rem;
            color: #000; text-align: center; margin-top: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8); /* Правим текста четим върху тъмен фон */
        }

        #share-area {
            display: none; position: absolute; bottom: 30px;
            left: 0; right: 0; text-align: center;
        }

        .share-btn {
            background: white; color: #a97171; border: 2px solid #a97171;
            padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }

        #flower {
            position: fixed; left: 50%; bottom: -200px; height: 55vh;
            transform: translateX(-50%) scale(0.5); transition: all 2s;
            z-index: 9999; opacity: 0; pointer-events: none;
        }

        #flower.pop-out { opacity: 1; bottom: 5vh; transform: translateX(-50%) scale(1.3); }

        .petal { position: fixed; z-index: 9998; background: #ffc0cb; border-radius: 150% 0 150% 0; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mp3"></audio>

<div id="setup">
    <h1>За теб...</h1>
    <input type="text" id="userName" placeholder="Име на дамата">
    <select id="wishSelect">
        <option value="0">🌹 Класическо пожелание</option>
        <option value="1">❤️ За любимата жена</option>
        <option value="2">👩‍👧 За най-добрата майка</option>
        <option value="3">💼 За уважавана колежка</option>
    </select>
    <button id="startBtn" onclick="startApp()">СЪЗДАЙ ✨</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        <div class="face front">
            <h1 id="display-name"></h1>
        </div>
        <div class="face back">
            <div id="typing-text"></div>
            <div id="share-area">
                <button class="share-btn" onclick="shareToOther(event)">ИЗПРАТИ КАРТИЧКА 🎀</button>
            </div>
        </div>
    </div>
</div>

<img src="bouquet.png" id="flower">

<script>
    const wishes = [
        "Бъди винаги така сияйна, нежна като пролетен цвят и вдъхновяваща! Честит 8-ми Март!",
        "Ти си моето вдъхновение! Желая ти цялото щастие на света, защото го заслужаваш. Обичам те!",
        "Мила мамо, благодаря ти за добротата и любовта. Бъди здрава и все така усмихната!",
        "Уважаема колежке, пожелавам Ви здраве, успехи и много радостни моменти. Честит празник!"
    ];

    let i = 0; let selectedWish = "";

    function startApp() {
        const name = document.getElementById('userName').value.trim();
        const wishIndex = document.getElementById('wishSelect').value;
        if (!name) return alert("Моля, въведи име.");

        selectedWish = wishes[wishIndex];
        document.getElementById('display-name').innerText = name + "!";
        document.getElementById('setup').style.display = 'none';
        document.getElementById('cardScene').style.display = 'flex';
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        document.getElementById('bgMusic').play();
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        setInterval(createPetal, 500);
    }

    function typeWriter() {
        if (i < selectedWish.length) {
            document.getElementById("typing-text").innerHTML += selectedWish.charAt(i);
            i++; setTimeout(typeWriter, 60);
        } else {
            setTimeout(() => {
                document.getElementById('flower').classList.add('pop-out');
                setTimeout(() => document.getElementById('share-area').style.display = 'block', 2000);
            }, 1000);
        }
    }

    function shareToOther(event) {
        event.stopPropagation();
        const newName = prompt("Име на дамата:");
        if (newName) {
            const currentUrl = window.location.href.split('?')[0];
            const wishIdx = document.getElementById('wishSelect').value;
            const newUrl = currentUrl + "?name=" + encodeURIComponent(newName) + "&w=" + wishIdx;
            navigator.clipboard.writeText(newUrl).then(() => alert("Линкът е копиран!"));
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.width = petal.style.height = (Math.random() * 15 + 10) + 'px';
        petal.style.animationDuration = (Math.random() * 2 + 3) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 5000);
    }
</script>
</body>
</html>
