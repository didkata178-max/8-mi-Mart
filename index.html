<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март - Магическа Картичка</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-pink: #d42d4d;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            background: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* НАЧАЛЕН ЕКРАН */
        #setup {
            text-align: center;
            background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), url('1.png');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            position: fixed;
            z-index: 2000; /* Винаги най-отгоре */
            border: 2px solid #a97171;
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #setup h1 {
            font-family: 'Great Vibes', cursive;
            color: #000;
            font-size: 2.2rem;
            margin: 0;
            background: rgba(255,255,255,0.6);
            padding: 10px;
            border-radius: 15px;
        }

        input {
            padding: 15px;
            border: 2px solid #a97171;
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        button {
            background: linear-gradient(45deg, #a97171, #c99393);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 35px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* КАРТИЧКА */
        .scene {
            width: 90vw;
            max-width: 400px;
            height: 80vh;
            perspective: 2000px;
            display: none; /* Скрита в началото */
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: url('2.png') center/cover;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .face.front { justify-content: center; }
        .face.back { transform: rotateY(180deg); justify-content: flex-start; }

        .face.front h2 { font-family: 'Great Vibes', cursive; font-size: 2.8rem; margin: 0; color: #000; }
        #display-name { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--rose-pink); margin: 0; text-align: center; }

        #typing-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.5rem;
            color: #2c3e50;
            text-align: center;
            background: var(--glass);
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
            min-height: 120px;
            z-index: 5;
        }

        /* БУКЕТ */
        #flower {
            position: absolute;
            left: 50%;
            bottom: 10%;
            max-width: 130%;
            opacity: 0;
            mix-blend-mode: multiply;
            transform: translateX(-50%) scale(0.1);
            transition: all 2s ease-out;
            pointer-events: none;
        }

        #flower.pop-out {
            opacity: 1;
            transform: translateX(-50%) scale(1.3); /* Голям, но центриран */
        }

        #share-area {
            position: absolute;
            bottom: 20px;
            display: none;
            width: 100%;
            text-align: center;
        }

        .share-btn {
            background: white;
            color: #a97171;
            border: 2px solid #a97171;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* ЛИСТЕНЦА */
        .petal { 
            position: absolute; 
            background: #ffb7c5;
            border-radius: 150% 0 150% 0; 
            opacity: 0.8; 
            z-index: 999; 
            animation: fall linear forwards;
        }

        @keyframes fall { 
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; } 
        }

        /* МОБИЛНИ КОРЕКЦИИ */
        @media (max-width: 480px) {
            #display-name { font-size: 2.4rem; }
            #typing-text { font-size: 1.25rem; }
            #flower.pop-out { scale: 1.1; bottom: 5%; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mp3"></audio>

<div id="setup">
    <h1>Магия за 8-ми Март</h1>
    <p>Напиши името на дамата:</p>
    <input type="text" id="userName" placeholder="Име">
    <button onclick="startApp()">СЪЗДАЙ ✨</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        
        <div class="face front">
            <h2>Честит празник,</h2>
            <h1 id="display-name"></h1>
            <p style="position:absolute; bottom:30px; font-size:0.8rem;">
                Докосни <span style="color:var(--rose-pink); font-weight:bold;">ТУК</span>
            </p>
        </div>
        
        <div class="face back">
            <div id="typing-text"></div>
            <img src="bouquet.png" id="flower">
            <div id="share-area">
                <button class="share-btn" onclick="shareToOther(event)">ИЗПРАТИ НА ДРУГА ДАМА 🎀</button>
            </div>
        </div>

    </div> </div> ```
<script>
    const wish = "Бъди винаги така сияйна, нежна като пролетен цвят и вдъхновяваща! Нека този празник ти донесе безброй усмивки и топлина в сърцето. Честит 8-ми март!";
    let i = 0;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        if (name) {
            document.getElementById('userName').value = name;
            startApp(true);
        }
    }

    function startApp(auto = false) {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert("Моля, въведи име.");

        document.getElementById('display-name').innerText = name + "!";
        
        // КЛЮЧЪТ: Скриваме едното напълно, показваме другото
        document.getElementById('setup').style.display = 'none';
        document.getElementById('cardScene').style.display = 'flex';

        if (!auto) {
            const music = document.getElementById('bgMusic');
            music.volume = 0.5;
            music.play().catch(() => console.log("Music wait"));
        }
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        setInterval(createPetal, 500);
    }

    function typeWriter() {
        if (i < wish.length) {
            document.getElementById("typing-text").innerHTML += wish.charAt(i);
            i++;
            setTimeout(typeWriter, 60);
        } else {
            setTimeout(() => {
                const img = document.getElementById('flower');
                img.classList.add('pop-out');
                setTimeout(() => {
                    document.getElementById('share-area').style.display = 'block';
                }, 2000);
            }, 500);
        }
    }

    function shareToOther(event) {
        event.stopPropagation();
        const newName = prompt("Име на дамата:");
        if (newName) {
            const newUrl = window.location.href.split('?')[0] + "?name=" + encodeURIComponent(newName);
            navigator.clipboard.writeText(newUrl);
            alert("Линкът за " + newName + " е копиран!");
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 15 + 10 + 'px';
        petal.style.width = size;
        petal.style.height = size;
        petal.style.animationDuration = (Math.random() * 2 + 4) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }
</script>
</body>
</html>
