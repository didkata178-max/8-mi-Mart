<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-ми Март - Магическа Картичка</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose-pink: #d42d4d;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            background: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* НАЧАЛЕН ЕКРАН */
        #setup {
            text-align: center;
            background: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('1.png');
            background-size: cover;
            background-position: center;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(126, 87, 87, 0.3); 
            position: absolute;
            z-index: 1000;
            border: 2px solid #a97171;
            width: 85%;
            max-width: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #setup h1 {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 15px;
            font-family: 'Great Vibes', cursive;
            color: #000000 !important;
            font-size: 2.2rem;
            margin: 0;
            backdrop-filter: blur(5px);
            width: 100%;
            box-sizing: border-box;
        }

        input {
            padding: 15px;
            border: 2px solid #a97171 !important; 
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            width: 85%;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #000000;
        }

        button {
            background: linear-gradient(45deg, #a97171, #c99393) !important;
            color: white !important;
            border: none !important;
            padding: 15px 45px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(169, 113, 113, 0.4);
            transition: 0.3s;
            text-transform: uppercase;
        }

        /* КАРТИЧКА */
        .scene {
            width: 90vw;
            max-width: 420px;
            height: 80vh;
            perspective: 2000px;
            display: none; /* Първоначално скрита */
            z-index: 10;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.open { transform: rotateY(-175deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background-image: url('2.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .face.front h2 {
            font-family: 'Great Vibes', cursive;
            color: #000000;
            font-size: 2.8rem;
            margin: 0;
        }

        .back { transform: rotateY(180deg); justify-content: flex-start; }

        #display-name { 
            font-family: 'Great Vibes', cursive; 
            color: var(--rose-pink); 
            font-size: 3.2rem; 
            margin: 0;
            text-align: center;
        }

        #typing-text {
            font-family: 'Great Vibes', cursive;
            font-size: 1.6rem;
            color: #2c3e50;
            text-align: center;
            line-height: 1.3;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
            min-height: 140px;
            box-sizing: border-box;
            border: none;
        }

        #flower {
            position: absolute;
            left: 50%;
            bottom: 20px; 
            max-width: 150%;
            opacity: 0;
            mix-blend-mode: multiply;
            transform: translateX(-50%) translateZ(-50px) scale(0.1);
            transition: all 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        #flower.pop-out {
            opacity: 1;
            transform: translateX(-50%) translateZ(120px) scale(1.4);
        }

        .alive { animation: float 5s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateZ(120px) scale(1.4) translateY(0); }
            50% { transform: translateX(-50%) translateZ(150px) scale(1.45) translateY(-15px); }
        }

        #share-area {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .share-btn {
            background: white;
            color: #a97171;
            border: 2px solid #a97171;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .petal { 
            position: absolute; 
            background: linear-gradient(135deg, #ffb7c5, #d42d4d);
            border-radius: 150% 0 150% 0; 
            opacity: 0.8; 
            pointer-events: none; 
            z-index: 9999; 
            animation: fall linear forwards;
        }

        @keyframes fall { 
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } 
        }

        /* МОБИЛНИ КОРЕКЦИИ */
        @media (max-width: 480px) {
            #setup { top: 50%; transform: translate(-50%, -50%); }
            #display-name { font-size: 2.5rem; }
            #typing-text { font-size: 1.3rem; min-height: 120px; }
            #flower.pop-out { scale: 1.2; bottom: 5%; }
            .face.front h2 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<div id="setup">
    <h1>Магия за 8-ми Март</h1>
    <p style="font-size: 0.9rem; color: #444; margin: 0;">Напиши името на дамата:</p>
    <input type="text" id="userName" placeholder="Име...">
    <button onclick="startApp()">СЪЗДАЙ ✨</button>
</div>

<div class="scene" id="cardScene">
    <div class="card" id="mainCard" onclick="openCard()">
        <div class="face front">
            <h2>Честит празник,</h2>
            <h1 id="display-name"></h1>
            <p style="position:absolute; bottom:30px; color:#000; font-size:0.8rem;">Докосни <span style="color:#d42d4d; font-weight:bold;">ТУК</span></p>
        </div>
        
        <div class="face back">
            <div id="typing-text"></div>
            <img src="bouquet.png" id="flower">
            <div id="share-area">
                <button class="share-btn" onclick="shareToOther(event)">ИЗПРАТИ НА ДРУГА ДАМА 🎀</button>
            </div>
        </div>
    </div>
</div>

<script>
    const wish = "Бъди винаги така сияйна, нежна като пролетен цвят и вдъхновяваща! Нека този празник ти донесе безброй усмивки и топлина в сърцето. Честит 8-ми март!";
    let i = 0;
    let petalInterval;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const nameFromUrl = urlParams.get('name');
        if (nameFromUrl) {
            document.getElementById('userName').value = nameFromUrl;
            startApp(true);
        }
    }

    function playMusic() {
        const bgMusic = document.getElementById('bgMusic');
        if (bgMusic) {
            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("Audio waiting for interaction"));
        }
    }

    function startApp(auto = false) {
        const nameInput = document.getElementById('userName');
        const name = nameInput.value.trim();

        if (!name) {
            alert("Моля, въведи име.");
            return;
        }

        document.getElementById('display-name').innerText = name + "!";
        
        // Скриваме стартовия екран и показваме картичката
        document.getElementById('setup').style.display = 'none';
        document.getElementById('cardScene').style.display = 'flex';

        if (!auto) playMusic();
    }

    function openCard() {
        const card = document.getElementById('mainCard');
        if (card.classList.contains('open')) return;
        
        playMusic();
        card.classList.add('open');
        setTimeout(typeWriter, 1200);
        petalInterval = setInterval(createPetal, 450);
    }

    function typeWriter() {
        if (i < wish.length) {
            document.getElementById("typing-text").innerHTML += wish.charAt(i);
            i++;
            setTimeout(typeWriter, 65);
        } else {
            clearInterval(petalInterval);
            setTimeout(() => {
                const img = document.getElementById('flower');
                img.classList.add('pop-out');
                setTimeout(() => {
                    img.classList.add('alive');
                    document.getElementById('share-area').style.display = 'block';
                }, 2500);
            }, 800);
        }
    }

    function shareToOther(event) {
        event.stopPropagation();
        const newName = prompt("Въведи името на дамата:");
        if (newName) {
            const currentUrl = window.location.href.split('?')[0];
            const newUrl = currentUrl + "?name=" + encodeURIComponent(newName);
            navigator.clipboard.writeText(newUrl).then(() => {
                alert("Линкът за " + newName + " е копиран! ✨");
            });
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        const size = Math.random() * 15 + 10 + 'px';
        petal.style.width = size;
        petal.style.height = size;
        petal.style.animationDuration = (Math.random() * 2 + 4) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }
</script>

</body>
</html>
